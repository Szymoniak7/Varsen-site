:root{
  --ink:#F7F7F5; --mute:#8C8E91; --violet:#9D6BFF; --lav:#D6C6FF; --deep:#06030C;
  --pad:clamp(20px,5vw,128px);
  --open:0;            /* 0 → 1 as dock 04 opens, driven by script */
  /* tokens the pinned-chapters moment reads */
  --bg:#07040E; --muted:#9C97AB; --accent:#9D6BFF; --line:rgba(214,198,255,.16); --gutter:24px;
  --font-text:"Stack Sans Text",system-ui,sans-serif; --r-md:10px; --nav:0px;
  --s-2:8px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px; --t-lead:clamp(19px,1.5vw,22px);
  --wrap:calc(100vw - 2*var(--pad));
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{scroll-behavior:auto;scroll-padding-top:0}
a:focus-visible{outline:2px solid var(--lav);outline-offset:3px;border-radius:4px}
body{overflow:hidden;background:var(--deep);color:var(--ink);font-family:"Stack Sans Text",system-ui,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}

/* ---------- light & atmosphere (layers rendered with the poster recipe) ---------- */
.hero{position:relative;min-height:100svh;overflow:hidden}
.lightfield{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none;background:#05020A}

/* ---------- layout ---------- */
.ui{position:relative;z-index:2;height:100svh;padding-top:var(--pad)!important;display:grid;grid-template-rows:1fr auto;padding:var(--pad) 0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,4.5vh,56px);min-height:0;padding:clamp(12px,3vh,32px) 0}
.logo{width:min(440px,72vw,50vh);height:auto;color:var(--ink)}
.m-enter .logo{animation:enter 1.6s .3s ease backwards}

/* ---------- variants ---------- */
[data-hero="beam"] .docks{display:none}
[data-hero="beam"] .logo{width:min(clamp(300px,33vw,860px),80vw,62vh)}
[data-hero="beam"] .center{padding-bottom:6vh}

/* ---------- docks ---------- */
.docks{width:min(640px,92vw,78vh);position:relative}
.m-enter .docks{animation:enter 1.6s .5s ease backwards}
.docks svg{width:100%;height:auto;display:block;overflow:visible}
.rail{stroke:#5B4A8A;stroke-width:1.5;opacity:.7}
.door rect.frame{fill:none;stroke:#4E3C86;stroke-width:2.5;transition:stroke .35s}
.door .slat{stroke:#2A2045;stroke-width:1.2}
.shutter .slat{stroke:#3A2C66}
.door .bump{fill:none;stroke:#35295C;stroke-width:1.5}
.door{cursor:default}
#d4 rect.frame{stroke:#4E3C86;transition:stroke 1.4s ease}
#d4.found rect.frame{stroke:#E4DAFF}
#d4 .light{fill:url(#lightFill);opacity:var(--open)}
#d4 .edge{opacity:0;transition:opacity 1.4s ease}
#d4.found .edge{opacity:1}
#d4.found .edge.soft{opacity:.35}
#d4 .shutter .slat{stroke:#2A2045}
#d4 .panel{fill-opacity:0;transition:fill-opacity 1.2s ease}
#d4.found .panel{fill-opacity:1}
#d4 .label{font:600 13px "Stack Sans Text",sans-serif;letter-spacing:.06em;fill:#CFC6E6;opacity:0;transition:opacity 1.4s ease}
#d4.found .label{opacity:1}


/* ---------- copy ---------- */
.hero-foot{display:grid;grid-template-columns:1fr auto;align-items:end;gap:32px;padding-top:24px;border-top:1px solid rgba(214,198,255,.12)}
h1{font-family:"Michroma",sans-serif;font-weight:400;font-size:clamp(15px,1.05vw,24px);line-height:1.6;letter-spacing:.01em;max-width:72ch;text-wrap:balance}
h1 span{display:block}
.desc{margin-top:.4em;font-size:clamp(14px,.8vw,18px);line-height:1.55;color:var(--mute)}
.m-enter .copy{animation:enter 1.4s .7s ease backwards}
.meta{justify-self:end;text-align:right;font-size:clamp(14px,.8vw,18px);line-height:1.55}
.clock{display:flex;align-items:baseline;justify-content:flex-end;gap:10px;margin-bottom:14px}
.clock__label{font:500 clamp(10px,.55vw,13px)/1 "Stack Sans Text",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#6E6B78}
.clock__time{font:400 clamp(11px,.62vw,14px)/1 "Michroma",sans-serif;color:#8C8E91;letter-spacing:.02em;display:inline-flex}
.clock__time i{font-style:normal;display:inline-block;width:.86em;text-align:center}
.clock__time b{font-weight:400;display:inline-block;width:.55em;text-align:center;color:#5E5B68}
.meta a{color:var(--ink);text-decoration:none;border-bottom:1px solid rgba(247,247,245,.25);transition:color .2s,border-color .2s}
.meta a:hover{color:var(--ink);border-color:var(--ink)}

/* ---------- nav ---------- */
.nav{position:absolute;top:0;left:0;right:0;z-index:5}
.nav__bar{position:relative;display:flex;align-items:center;justify-content:flex-end;gap:28px;height:84px}
.nav__links{display:flex;gap:28px;margin-right:auto}
.nav__links a{color:var(--ink);text-shadow:0 0 12px rgba(5,2,10,.9),0 0 3px rgba(5,2,10,.9);text-decoration:none;font-size:15px;padding:12px 0;background:linear-gradient(currentColor,currentColor) 0 calc(100% - 8px)/0 1px no-repeat;transition:background-size .3s,color .2s}
.nav__links a:hover{color:var(--ink);background-size:100% 1px}
.btn--sm{min-height:44px;padding:0 18px;font-size:14px}
.skip{position:absolute;left:0;top:-60px;background:var(--ink);color:#0B0716;padding:10px 14px;border-radius:6px;text-decoration:none;z-index:9}
.skip:focus{top:20px}

/* ---------- buttons: one primary, one secondary; they step on hover and press on click ---------- */
.btn-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:8px;font:500 15px/1 var(--font-text);text-decoration:none;
  transition:transform .18s cubic-bezier(.22,1,.36,1),background-color .2s,border-color .2s,color .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:focus-visible{outline:2px solid var(--lav);outline-offset:3px}
.btn--primary{background:var(--ink);color:#0B0716}
.btn--primary:hover{background:#fff}
.btn--secondary{border:1px solid rgba(247,247,245,.28);color:var(--ink)}
.btn--secondary:hover{border-color:var(--ink)}

/* ---------- sections below the hero: flat dark ground, one screen each ---------- */
main > section{position:relative;background:var(--bg)}
.wrap{width:var(--wrap);margin:0 auto}
h2{font-family:"Michroma",sans-serif;font-weight:400;font-size:clamp(21px,2.4vw,36px);line-height:1.2}
.lead{margin-top:16px;color:var(--muted);font-size:17px;line-height:1.55;max-width:46ch}
#how{min-height:100svh;padding:clamp(72px,10vh,120px) 0}
#how .mo-pc__step p{color:#C9C5D4;line-height:1.55;font-size:16px}
#how .mo-pc__visual{background:#05020A}
#how .mo-pc__visuals{border-radius:var(--r-md);overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.close{height:100svh;display:flex;padding:72px 0;border-top:1px solid var(--line);
  background:radial-gradient(60% 50% at 50% 110%,rgba(90,43,224,.22),transparent 70%),var(--bg)}
.close__wrap{display:grid;grid-template-rows:1fr auto}
.close__grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:var(--gutter);row-gap:40px;align-items:start;align-self:center}
.close h2{max-width:16ch}
.close__grid > :first-child{padding-right:48px}
.close .lead{max-width:44ch}
.brief{border:1px solid var(--line);border-radius:var(--r-md);padding:clamp(24px,3vw,40px);background:rgba(20,12,40,.45)}
.brief h3{font:500 var(--t-lead)/1.3 var(--font-text);margin-bottom:20px}
.brief ol{list-style:none;counter-reset:n;display:grid;gap:0}
.brief li{counter-increment:n;display:grid;grid-template-columns:40px 1fr;row-gap:2px;padding:12px 0;border-top:1px solid var(--line)}
.brief li::before{content:"0" counter(n);grid-row:span 2;font:400 14px/1.6 "Michroma",sans-serif;color:var(--accent)}
.brief li b{font-weight:500;font-size:17px}
.brief li span{color:var(--muted);font-size:15px;line-height:1.5}
.brief__note{margin-top:16px;color:var(--muted);font-size:14px}
.closing{background:var(--bg)}
.site-foot{border-top:1px solid var(--line)}
.site-foot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;font-size:13px;color:var(--mute);padding:22px 0}
.site-foot a{color:var(--mute);text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .3s,color .2s}
.site-foot a:hover{color:var(--ink);background-size:100% 1px}

@media (max-width:900px){.close__grid{grid-template-columns:1fr}.close{height:auto;min-height:100svh}}
@media (max-height:820px) and (min-width:901px){.brief__note{display:none}}
@media (max-width:640px){.hero-foot{grid-template-columns:1fr;gap:12px}.meta{justify-self:start;text-align:left}.clock{justify-content:flex-start;margin-bottom:12px}#how{min-height:calc(2*100lvh);padding:72px 0;display:flex;flex-direction:column;justify-content:center}#how .mo-pc__steps{gap:56px!important}#how .mo-pc__visual>img{aspect-ratio:4/3!important;height:auto!important;max-height:none!important}.nav__links{display:none}.nav__bar{height:72px}.ui{padding-top:72px!important}}
@media (max-width:760px){
  .btn-row .btn{width:100%}
  body{overflow:auto}
  .ui{min-height:100svh;height:auto;gap:28px}
  .hero-foot{grid-template-columns:1fr}
  .meta{justify-self:start;text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}
  .beam{opacity:1}.beam.echo{opacity:0}
}
/* ---------- phones ---------- */
@media (max-width:640px){
  .ui{padding:max(var(--pad),env(safe-area-inset-top)) 0 calc(20px + env(safe-area-inset-bottom))!important;height:100svh;min-height:0}
  .hero-foot{padding-top:20px;gap:14px}
  h1{font-size:16px;line-height:1.55;text-wrap:pretty}
  .desc{font-size:14px;margin-top:6px}
  .meta{font-size:16px}
  .meta a{display:inline-block;padding:12px 0;margin:-12px 0;border-bottom:0;text-decoration:underline;text-decoration-color:rgba(247,247,245,.3);text-underline-offset:4px}   /* a 44px tall target for a thumb */
  .clock{margin-bottom:16px}
  .clock__label{font-size:10px}.clock__time{font-size:12px}
  [data-hero="beam"] .logo{width:min(82vw,340px)}
}
/* a phone turned sideways: logo and footer side by side would not fit, so tighten */
@media (max-height:480px) and (orientation:landscape){
  .ui{padding:max(16px,env(safe-area-inset-top)) max(var(--pad),env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(var(--pad),env(safe-area-inset-left))!important}
  .ui.wrap{width:100%}
  [data-hero="beam"] .logo{width:min(46vw,58vh*3)}
  .hero-foot{padding-top:14px}
  h1{font-size:14px}
}
</style>

/* ---- the time in Poland, for visitors in other time zones ---- */
(function clock() {
  const now = new Date();
  const t = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Warsaw", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).format(now);
  const p = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Warsaw", timeZoneName: "shortOffset" }).formatToParts(now).find(x => x.type === "timeZoneName");
  document.getElementById("pl-zone").textContent = p && /\+2/.test(p.value) ? "CEST" : "CET";
  document.getElementById("pl-time").innerHTML = [...t].map(c => c === ":" ? "<b>:</b>" : `<i>${c}</i>`).join("");
  setTimeout(clock, 1000 - now.getMilliseconds() + 20);
})();

/* ---- build the dock doors ---- */
const NS = "http://www.w3.org/2000/svg", g = document.getElementById("doors");
const el = (n, a, p = g) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
const W = 104, H = 164, GAP = 46, X0 = (980 - (6 * W + 5 * GAP)) / 2, Y = 62;
let shutter;
for (let i = 0; i < 6; i++) {
  const x = X0 + i * (W + GAP), id = "d" + (i + 1);
  const d = el("g", {class: "door", id});
  if (i === 3) {
    document.getElementById("d4cliprect").setAttribute("x", x);
    el("rect", {class: "light", x, y: Y, width: W, height: H}, d);
    shutter = el("g", {"clip-path": "url(#d4clip)"}, d);
    const s = el("g", {class: "shutter"}, shutter);
    el("rect", {class: "panel", x, y: Y, width: W, height: H, fill: "#0C0717"}, s);
    el("rect", {class: "edge soft", x, y: Y + H - 8, width: W, height: 8, fill: "#B9A0FF"}, s);
    el("rect", {class: "edge", x, y: Y + H - 3, width: W, height: 3, fill: "#EFE6FF"}, s);
    for (let k = 1; k < 12; k++) el("line", {class: "slat", x1: x + 4, x2: x + W - 4, y1: Y + k * H / 12, y2: Y + k * H / 12}, s);
    shutter = s;
    const lb = el("text", {class: "label", x: x + W / 2, y: Y - 22, "text-anchor": "middle"}, d); lb.textContent = "DOCK 04";
  } else {
    for (let k = 1; k < 8; k++) el("line", {class: "slat", x1: x + 6, x2: x + W - 6, y1: Y + k * H / 8, y2: Y + k * H / 8}, d);
  }
  el("rect", {class: "frame", x, y: Y, width: W, height: H}, d);
  el("rect", {class: "bump", x: x + W / 2 - 22, y: Y + H + 8, width: 44, height: 16}, d);
}

/* ---- the story: the searchlight scans the dock row, settles on dock 04, the door opens and takes over the light ---- */
const root = document.documentElement;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TARGET = 0.86;                 // leave the door slightly ajar: "opens soon"
const END = 5600;                    // story length in ms at normal speed
function setOpen(p) {
  root.style.setProperty("--open", p.toFixed(3));
  shutter.setAttribute("transform", `translate(0 ${-p * H})`);
}
/* one continuous take: the light exposes slowly, drifts once onto dock 04, the door rises in one motion and takes over */
const FOUND = document.documentElement.dataset.hero === "dock" ? 700 : 2400;
const K = {
  aim:   [[0, 3.35], [3600, 4], [END, 4]],                         // a single slow drift onto door 4 (1-6), no search
  width: [[0, 1.05], [3600, .8], [END, .8]],
  alpha: [[0, 0], [2000, .85], [3000, .95], [END, .16]],            // exposes, holds, hands over to the dock
  spot:  [[0, 0], [2000, .3], [3000, .42], [END, 0]],
  door:  [[0, 0], [2700, 0], [5400, TARGET], [END, TARGET]]          // one continuous rise
};
if (HERO === "dock") {
  K.alpha = [[0, 0], [END, 0]]; K.spot = [[0, 0], [END, 0]];
  K.door = [[0, 0], [1100, 0], [4200, TARGET], [END, TARGET]];
}
const ease = t => .5 - Math.cos(Math.PI * t) / 2;
function at(track, t) {
  if (t <= track[0][0]) return track[0][1];
  for (let i = 1; i < track.length; i++) if (t < track[i][0]) {
    const [ta, a] = track[i - 1], [tb, b] = track[i]; return a + (b - a) * ease((t - ta) / (tb - ta));
  }
  return track[track.length - 1][1];
}
/* a visitor who has seen it, or who starts to scroll or click, gets it faster */
let speed = 1;
try { if (localStorage.getItem("varsen-seen")) speed = 2.5; localStorage.setItem("varsen-seen", "1"); } catch (e) {}
const hurry = () => { speed = Math.max(speed, 5); };
["wheel", "touchstart", "keydown", "pointerdown"].forEach(ev => addEventListener(ev, hurry, { once: true, passive: true }));
const story = { t: reduce ? END : 0, last: performance.now() };
function storyTick(now) {
  story.t = Math.min(END, story.t + (now - story.last) * speed); story.last = now;
  const t = story.t;
  const rest = t >= END && !reduce ? Math.sin(now / 1000 * .55) * .008 : 0;   // after the story: a slow breath only
  setOpen(at(K.door, t) + rest);
  d4el.classList.toggle("found", t >= FOUND);
  return t;
}
const d4el = document.getElementById("d4");
setOpen(reduce ? TARGET : 0);
if (reduce) d4el.classList.add("found");

/* ---- the light: base, searchlight, dock spill, vignette and grain drawn on one canvas behind the hero ---- */
const cv = document.getElementById("light"), cx = cv.getContext("2d");
const img = {}; let loaded = 0;
for (const k in SRC) { img[k] = new Image(); img[k].onload = () => { if (++loaded === 4) { geo(); frame(performance.now()); } }; img[k].src = SRC[k]; }
let G = {}, grainPat = null, grainA = null, grainB = null, beamMask = null, t0 = performance.now();
const bcv = document.createElement("canvas"), bcx = bcv.getContext("2d");
function geo() {
  const hero = cv.parentElement.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, 1.5);
  cv.width = Math.round(hero.width * dpr); cv.height = Math.round(hero.height * dpr);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const L = document.querySelector(".logo").getBoundingClientRect();
  const r = document.querySelector("#d4 rect.frame").getBoundingClientRect();
  const doors = [1, 2, 3, 4, 5, 6].map(i => document.querySelector(`#d${i} rect.frame`).getBoundingClientRect())
    .map(q => ({ x: q.left - hero.left + q.width / 2, y: q.top - hero.top + q.height / 2 }));
  const ox = -hero.width * .04, oy = -hero.height * .08;
  const d4 = doors[3], d = Math.hypot(d4.x - ox, d4.y - oy);
  const k = r.width / 150;                      // spill.png holds a 150 px door at (625,170) of 1400
  const lx = L.left - hero.left + L.width * .42, ly = L.top - hero.top + L.height * .6;
  const dl = Math.hypot(lx - ox, ly - oy);
  G = { w: hero.width, h: hero.height, ox, oy, doors, lx, ly, dl, bw: d * 4 * 1.15, bh: d * 4 * 1.15 * 520 / 2400,
        sx: r.left - hero.left - 625 * k, sy: r.top - hero.top - 170 * k, sw: 1400 * k };
  grainPat = cx.createPattern(img.grain, "repeat");
  if (!beamMask) {
    beamMask = document.createElement("canvas"); beamMask.width = img.beam.width; beamMask.height = img.beam.height;
    const mx = beamMask.getContext("2d"); mx.drawImage(img.beam, 0, 0);
    const d = mx.getImageData(0, 0, beamMask.width, beamMask.height), p = d.data;
    for (let i = 0; i < p.length; i += 4) {
      const l = (p[i] * .3 + p[i + 1] * .59 + p[i + 2] * .11) / 255;
      p[i] = p[i + 1] = p[i + 2] = 255; p[i + 3] = Math.min(255, l * 255 * 1.1);
    }
    mx.putImageData(d, 0, 0);
  }
  if (!grainA) {
    const speck = (seed, dens) => {
      const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d");
      const im = g.createImageData(256, 256); let x = seed;
      for (let i = 0; i < im.data.length; i += 4) {
        x = (x * 1664525 + 1013904223) >>> 0; const r = x / 4294967296;
        const v = r > 1 - dens ? 140 + (r - (1 - dens)) / dens * 115 : 0;
        im.data[i] = v * .9; im.data[i + 1] = v * .84; im.data[i + 2] = v; im.data[i + 3] = 255;
      }
      g.putImageData(im, 0, 0); return cx.createPattern(c, "repeat");
    };
    grainA = speck(7, .07); grainB = speck(91, .05);
  }
  bcv.width = cv.width; bcv.height = cv.height; bcx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function draw(now) {
  const t = (now - t0) / 1000, { w, h } = G;
  cx.globalCompositeOperation = "source-over"; cx.globalAlpha = 1;
  const s = Math.max(w / img.base.width, h / img.base.height);
  cx.drawImage(img.base, (w - img.base.width * s) / 2, (h - img.base.height * s) / 2, img.base.width * s, img.base.height * s);
  cx.globalCompositeOperation = "screen";
  const st = storyTick(now);
  if (HERO === "beam") {
    /* the searchlight: exposes, then drifts slowly across the logo, one pass every 30 s */
    const intro = reduce ? 1 : Math.min(1, Math.max(0, (t - .2) / 2.6)), e = .5 - Math.cos(Math.PI * intro) / 2;
    const sweep = reduce ? 6.5 : 8.5 + Math.sin(t * 2 * Math.PI / 30) * 4;
    const breath = reduce ? .9 : .82 + .1 * (.5 + .5 * Math.sin(t * 2 * Math.PI / 17));
    const bw = G.dl * 4 * 1.2, bh = bw * 520 / 2400;
    cx.save(); cx.globalAlpha = e * breath;
    cx.translate(G.ox, G.oy); cx.rotate(Math.atan2(G.ly - G.oy, G.lx - G.ox) + sweep * Math.PI / 180);
    cx.drawImage(img.beam, -bw / 2, -bh / 2, bw, bh); cx.restore();
    G.beamT = { ang: Math.atan2(G.ly - G.oy, G.lx - G.ox) + sweep * Math.PI / 180, bw, bh, e };

  } else if (HERO === "story") {
  const f = at(K.aim, st), i = Math.min(5, Math.max(0, Math.floor(f - 1))), u = (f - 1) - i;
  const pa = G.doors[Math.max(0, Math.min(5, i))], pb = G.doors[Math.min(5, i + 1)];
  const px = pa.x + (pb.x - pa.x) * u + (f < 1 ? (f - 1) * (G.doors[1].x - G.doors[0].x) : 0), py = pa.y + (pb.y - pa.y) * u;
  const ang = Math.atan2(py - G.oy, px - G.ox);
  const dist = Math.hypot(px - G.ox, py - G.oy);
  const wf = at(K.width, st), al = at(K.alpha, st), boost = Math.max(0, al - 1);
  bcx.globalCompositeOperation = "source-over"; bcx.clearRect(0, 0, G.w, G.h);
  bcx.save(); bcx.translate(G.ox, G.oy); bcx.rotate(ang);
  bcx.drawImage(img.beam, -G.bw / 2, -G.bh * wf / 2, G.bw, G.bh * wf);
  bcx.restore();
  /* the beam ends where it lands: fade it out just past the target */
  bcx.globalCompositeOperation = "destination-in";
  const fade = bcx.createRadialGradient(G.ox, G.oy, 0, G.ox, G.oy, dist * 1.12);
  fade.addColorStop(0, "rgba(0,0,0,1)"); fade.addColorStop(.86, "rgba(0,0,0,1)"); fade.addColorStop(1, "rgba(0,0,0,0)");
  bcx.fillStyle = fade; bcx.fillRect(0, 0, G.w, G.h);
  cx.globalAlpha = Math.min(1, al); cx.drawImage(bcv, 0, 0, G.w, G.h);
  /* the pool of light on the door it points at */
  const sp = at(K.spot, st);
  if (sp > 0) {
    const R0 = (G.doors[1].x - G.doors[0].x) * .9;
    const g = cx.createRadialGradient(px, py, 0, px, py, R0);
    g.addColorStop(0, `rgba(150,120,255,${.55 * sp})`); g.addColorStop(.45, `rgba(98,64,240,${.28 * sp})`); g.addColorStop(1, "rgba(60,30,200,0)");
    cx.globalAlpha = 1; cx.fillStyle = g; cx.fillRect(px - R0, py - R0, R0 * 2, R0 * 2);
  }
  }
  if (HERO !== "beam") {
    cx.globalCompositeOperation = "screen";
    cx.globalAlpha = +getComputedStyle(root).getPropertyValue("--open") || 0;
    cx.drawImage(img.spill, G.sx, G.sy, G.sw, G.sw);
  }
  cx.globalAlpha = 1; cx.globalCompositeOperation = "source-over";
  const v = cx.createRadialGradient(w / 2, h * .45, Math.min(w, h) * .55, w / 2, h * .45, Math.max(w, h) * .75);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.5)");
  cx.fillStyle = v; cx.fillRect(0, 0, w, h);
  const top = cx.createLinearGradient(0, 0, 0, 150);
  top.addColorStop(0, "rgba(4,2,8,.55)"); top.addColorStop(1, "rgba(4,2,8,0)");
  cx.fillStyle = top; cx.fillRect(0, 0, w, 150);
  cx.globalCompositeOperation = "overlay"; cx.globalAlpha = .5;
  cx.fillStyle = grainPat; cx.fillRect(0, 0, w, h);
  /* living grain: inside the beam two grain layers drift slowly in slightly different directions;
     where they overlap the specks of light appear, fade and pass into each other */
  if (HERO === "beam" && G.beamT) {
    const B = G.beamT, ca = Math.cos(B.ang), sa = Math.sin(B.ang);
    const tt = reduce ? 0 : t;
    bcx.globalCompositeOperation = "source-over"; bcx.globalAlpha = 1; bcx.clearRect(0, 0, w, h);
    const flow = (pat, sp, turn, scale) => {
      const c = Math.cos(B.ang + turn), s = Math.sin(B.ang + turn);
      pat.setTransform(new DOMMatrix().translate(c * sp * tt, s * sp * tt).scale(scale));
      bcx.fillStyle = pat; bcx.fillRect(0, 0, w, h);
    };
    flow(grainA, 9, .35, 1);                       // along the beam, slightly down
    bcx.globalCompositeOperation = "lighter"; bcx.globalAlpha = .9;
    flow(grainB, 5.5, -.55, 1.35);                 // slower, larger, slightly up: the two cross
    bcx.globalAlpha = 1;
    bcx.save(); bcx.translate(G.ox, G.oy); bcx.rotate(B.ang);
    bcx.globalCompositeOperation = "destination-in";  // a soft mask made of the beam's own brightness: no edge anywhere
    bcx.drawImage(beamMask, -B.bw / 2, -B.bh / 2, B.bw, B.bh);
    bcx.restore();
    const k = reduce ? .5 : .5 - .5 * Math.cos(t * 2 * Math.PI / 11);
    cx.globalCompositeOperation = "lighter"; cx.globalAlpha = (.55 + .3 * k) * B.e;
    cx.drawImage(bcv, 0, 0, w, h);
  }
  cx.globalAlpha = 1; cx.globalCompositeOperation = "source-over";
}
let visible = true;
new IntersectionObserver(e => { visible = e[0].isIntersecting; }).observe(cv);
function frame(now) { if (visible) draw(now); if (!reduce) requestAnimationFrame(frame); }
addEventListener("resize", () => { if (loaded === 4) { geo(); draw(performance.now()); } });
document.fonts && document.fonts.ready.then(() => { if (loaded === 4) geo(); });
</script>
</body>
